<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makan Apa Hari Ini? - Tembalang</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        
        /* --- ANIMASI --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); visibility: hidden; }
        }

        /* --- STYLE KOTAK (CARD) KACA BURAM --- */
        .card-box {
            /* Warna diturunkan jadi krem transparan (85% opacity) agar tidak silau */
            background-color: rgba(255, 248, 240, 0.85); 
            /* Efek blur ditebalkan agar seperti kaca */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); 
            text-align: center;
            max-width: 480px;
            width: 90%;
            
            /* Border tipis ala kaca dengan garis atas oranye */
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 5px solid #f97316;
        }

        /* --- LAYAR INTRO --- */
        #intro-screen {
            animation: fadeIn 0.6s ease-out forwards;
        }
        .intro-emoji {
            font-size: 70px;
            margin-bottom: 10px;
            animation: bounce 2s infinite; 
        }
        .intro-title {
            color: #9a3412;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .intro-desc {
            color: #57534e;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-mulai {
            background-color: #f97316;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(249, 115, 22, 0.4);
            transition: all 0.3s;
        }
        .btn-mulai:hover { background-color: #ea580c; transform: translateY(-2px); }

        /* --- LAYAR UTAMA (APLIKASI) --- */
        #main-app {
            display: none; 
        }
        
        h1 { color: #9a3412; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #78716c; margin-bottom: 20px; font-size: 14px; }
        .section-title { font-size: 13px; font-weight: bold; color: #57534e; text-align: left; margin-bottom: 8px; margin-top: 15px; }
        
        .btn-group { display: flex; gap: 6px; margin-bottom: 15px; }
        .mode-btn, .filter-btn {
            flex: 1; padding: 10px; font-size: 13px; font-weight: bold;
            border: 2px solid; background-color: rgba(255, 255, 255, 0.7); border-radius: 8px;
            cursor: pointer; transition: all 0.3s;
        }
        .mode-btn { border-color: #f97316; color: #ea580c; }
        .mode-btn.active, .mode-btn:hover { background-color: #f97316; color: white; }
        .filter-btn { border-color: #eab308; color: #ca8a04; font-size: 12px; }
        .filter-btn.active, .filter-btn:hover { background-color: #eab308; color: white; }
        
        #hasil {
            font-size: 18px; font-weight: bold; color: #b91c1c; min-height: 85px;
            margin-bottom: 20px; padding: 15px; background-color: rgba(255, 247, 237, 0.8);
            border: 2px dashed #fdba74; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 6px;
        }
        .info-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .badge-murah { background-color: #dcfce7; color: #15803d; }
        .badge-mahal { background-color: #fee2e2; color: #b91c1c; }
        .badge-umum { background-color: #fef3c7; color: #b45309; }

        #hasil a {
            color: #ea580c; font-size: 13px; text-decoration: none;
            display: inline-block; margin-top: 4px; background-color: white;
            padding: 5px 12px; border-radius: 15px; border: 1px solid #ea580c;
            transition: all 0.2s;
        }
        #hasil a:hover { background-color: #ea580c; color: white; }
        
        .main-btn {
            background-color: #ef4444; color: white; border: none; padding: 15px 20px;
            font-size: 17px; font-weight: bold; border-radius: 10px; cursor: pointer;
            transition: 0.3s; width: 100%; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }
        .main-btn:hover { background-color: #dc2626; }
        .main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- ================= LAYAR INTRO ================= -->
    <div id="intro-screen" class="card-box">
        <div class="intro-emoji">🤤🍗🍜</div>
        <div class="intro-title">Bingung Mau Makan Apa?</div>
        <div class="intro-desc">Pusing tiap hari mikirin menu makan di Tembalang? Tenang, biar website ini yang bantu milih secara acak buat kamu!</div>
        <button class="btn-mulai" onclick="masukAplikasi()">Gas Cari Makan! 🚀</button>
    </div>

    <!-- ================= LAYAR APLIKASI UTAMA ================= -->
    <div id="main-app" class="card-box">
        <h1>Makan Apa Hari Ini? 🍽️</h1>
        <p class="subtitle">Pengacak Kuliner Tembalang</p>
        
        <!-- Pilihan Mode -->
        <div class="section-title">Pilih Mode:</div>
        <div class="btn-group">
            <button class="mode-btn active" onclick="ubahMode('rekomendasi', this)">⭐ Rekomendasiku</button>
            <button class="mode-btn" onclick="ubahMode('umum', this)">🔍 Kategori Umum</button>
        </div>

        <!-- Pilihan Filter Harga -->
        <div id="filter-container">
            <div class="section-title">Filter Harga:</div>
            <div class="btn-group">
                <button class="filter-btn active" onclick="ubahFilter('semua', this)">Semua Harga</button>
                <button class="filter-btn" onclick="ubahFilter('<25', this)">&lt; 25 Ribu</button>
                <button class="filter-btn" onclick="ubahFilter('>25', this)">&gt; 25 Ribu</button>
            </div>
        </div>

        <div id="hasil">Pilih mode lalu klik tombol acak!</div>
        
        <button class="main-btn" onclick="acakMenu()">Acak Sekarang!</button>
    </div>

    <!-- ================= SCRIPT JAVASCRIPT ================= -->
    <script>
        function masukAplikasi() {
            const intro = document.getElementById('intro-screen');
            const app = document.getElementById('main-app');
            
            intro.style.animation = 'fadeOut 0.4s ease-out forwards';
            
            setTimeout(() => {
                intro.style.display = 'none'; 
                app.style.display = 'block'; 
                app.style.animation = 'fadeIn 0.6s ease-out forwards'; 
            }, 400); 
        }

        const listRekomendasi = [
            { nama: "Depot Harmoni", harga: ">25" }, { nama: "Temcit Chiken", harga: "<25" },
            { nama: "Ayam Krispi Bapae", harga: "<25" }, { nama: "Nasi Rawon Tengah Malam", harga: ">25" },
            { nama: "Batterhub", harga: ">25" }, { nama: "Putra Bungsu Padang", harga: "<25" },
            { nama: "Rasa Ayam", harga: ">25" }, { nama: "Bu Nur", harga: "<25" },
            { nama: "Baskoro Sami Seneng", harga: ">25" }, { nama: "Penyetan Angkringan Pendopo", harga: "<25" },
            { nama: "Omar", harga: ">25" }, { nama: "Bebek Sebelah Patung Kuda", harga: ">25" },
            { nama: "Ayam Bu Tumbar", harga: "<25" }, { nama: "Sate Sundu Ngaliyan", harga: ">25" },
            { nama: "Sate Taichan Morokangen", harga: ">25" }, { nama: "Padangju", harga: ">25" },
            { nama: "Nasi Kuning Pasundan", harga: "<25" }, { nama: "Ketoprak Indomie Mas Kembar", harga: "<25" },
            { nama: "Maestro", harga: "<25" }, { nama: "Leleh", harga: "<25" },
            { nama: "Preksu", harga: "<25" }, { nama: "Warung Makan Gondang Raya", harga: "<25" },
            { nama: "Nasi Uduk JKT", harga: ">25" }, { nama: "Ma Prie 2", harga: "<25" },
            { nama: "Omaira", harga: "<25" }, { nama: "Kedai Tinari", harga: ">25" },
            { nama: "Ayam Jaya", harga: ">25" }, { nama: "Konicipi", harga: ">25" },
            { nama: "Ayam Pagembus", harga: ">25" }, { nama: "Penyet Kuah Timoho", harga: "<25" },
            { nama: "Bubur Mas Bon", harga: "<25" }, { nama: "Bubur Pak Sholeh", harga: "<25" },
            { nama: "Kedai Seafood JKT", harga: ">25" }, { nama: "Warung Muda Spesial Ayam Bakar", harga: ">25" },
            { nama: "Selaras Resto", harga: "<25" }
        ];

        const listUmum = [
            "Soto Ayam / Daging", "Nasi Goreng / Mie Goreng", "Bubur Ayam",
            "Ayam Geprek / Penyetan", "Nasi Padang", "Nasi Kuning / Uduk",
            "Sate Ayam / Taichan", "Bakso / Mie Ayam", "Warteg / Nasi Rames",
            "Bebek Goreng / Bakar", "Ketoprak / Gado-gado", "Seafood / Pecel Lele", "Warmindo / Burjo"
        ];

        let modeAktif = 'rekomendasi';
        let filterAktif = 'semua';

        function ubahMode(mode, elemenTombol) {
            modeAktif = mode;
            const semuaTombolMode = document.querySelectorAll('.mode-btn');
            semuaTombolMode.forEach(btn => btn.classList.remove('active'));
            elemenTombol.classList.add('active');

            const filterContainer = document.getElementById("filter-container");
            if (mode === 'umum') {
                filterContainer.style.display = 'none';
            } else {
                filterContainer.style.display = 'block';
            }
        }

        function ubahFilter(filter, elemenTombol) {
            filterAktif = filter;
            const semuaTombolFilter = document.querySelectorAll('.filter-btn');
            semuaTombolFilter.forEach(btn => btn.classList.remove('active'));
            elemenTombol.classList.add('active');
        }

        function acakMenu() {
            const elemenHasil = document.getElementById("hasil");
            elemenHasil.innerHTML = "Mencarikan menu yang pas... 😋";

            setTimeout(() => {
                if (modeAktif === 'rekomendasi') {
                    let daftarPilihan = listRekomendasi;
                    if (filterAktif !== 'semua') {
                        daftarPilihan = listRekomendasi.filter(item => item.harga === filterAktif);
                    }

                    if (daftarPilihan.length === 0) {
                        elemenHasil.innerHTML = "Oops! Tidak ada tempat makan yang sesuai filter.";
                        return;
                    }

                    const indeksAcak = Math.floor(Math.random() * daftarPilihan.length);
                    const terpilih = daftarPilihan[indeksAcak];
                    const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(terpilih.nama + " Tembalang")}`;
                    
                    const kelasBadge = terpilih.harga === '<25' ? 'badge-murah' : 'badge-mahal';
                    const teksBadge = terpilih.harga === '<25' ? '💰 Di Bawah 25rb' : '💸 Di Atas 25rb';

                    elemenHasil.innerHTML = `
                        <span>⭐ ${terpilih.nama}</span>
                        <span class="info-badge ${kelasBadge}">${teksBadge}</span>
                        <a href="${urlMaps}" target="_blank">📍 Menuju Titik Maps</a>
                    `;
                } else {
                    const indeksAcak = Math.floor(Math.random() * listUmum.length);
                    const kategoriTerpilih = listUmum[indeksAcak];
                    const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(kategoriTerpilih + " terdekat Tembalang")}`;
                    
                    elemenHasil.innerHTML = `
                        <span>🍽️ ${kategoriTerpilih}</span>
                        <span class="info-badge badge-umum">🔍 Cari Kategori Ini</span>
                        <a href="${urlMaps}" target="_blank">📍 Cari Banyak Opsi di Maps</a>
                    `;
                }
            }, 600);
        }
    </script>
</body>
</html>
